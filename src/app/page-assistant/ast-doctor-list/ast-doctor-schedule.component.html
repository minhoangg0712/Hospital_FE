<div class="ast-doctor-list">
    <h2>Lịch làm bác sĩ</h2>
    <div class="controls">
        <mat-form-field appearance="outline">
            <mat-label>Tìm bác sĩ</mat-label>
            <input type="text" matInput [formControl]="doctorCtrl" [matAutocomplete]="auto" (input)="applyFilter($any($event.target).value)">
            <mat-autocomplete #auto="matAutocomplete" [displayWith]="displayDoctor">
                <mat-option *ngFor="let d of filteredDoctors$ | async" [value]="d">
                {{ d.name }}
                </mat-option>
            </mat-autocomplete>
        </mat-form-field>
        <button mat-button (click)="clearFilter()">Xóa filter</button>
    </div>

    <div class="grid-wrapper">
        <table mat-table [dataSource]="dataSource" matSort>
        <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>ID</th>
            <td mat-cell *matCellDef="let e">{{ e.id }}</td>
        </ng-container>
        <ng-container matColumnDef="doctorName">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Bác sĩ</th>
            <td mat-cell *matCellDef="let e">{{ e.doctorName }}</td>
        </ng-container>
        <ng-container matColumnDef="date">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Ngày</th>
            <td mat-cell *matCellDef="let e">{{ e.date }}</td>
        </ng-container>
        <ng-container matColumnDef="startTime">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Bắt đầu</th>
            <td mat-cell *matCellDef="let e">{{ e.startTime }}</td>
        </ng-container>
        <ng-container matColumnDef="endTime">
            <th mat-header-cell *matHeaderCellDef mat-sort-header>Kết thúc</th>
            <td mat-cell *matCellDef="let e">{{ e.endTime }}</td>
        </ng-container>
        <ng-container matColumnDef="room">
            <th mat-header-cell *matHeaderCellDef>Phòng</th>
            <td mat-cell *matCellDef="let e">{{ e.room }}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        </table>
        <mat-paginator [pageSizeOptions]="[5, 10, 25]" showFirstLastButtons></mat-paginator>
    </div>
</div>
